[package]
name = "ccm-tui"
version = "1.0.0"
edition = "2021"
description = "Claude Code Manager — Terminal UI"
authors = ["Claude Code Manager"]
license = "MIT"

[[bin]]
name = "ccm"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
which = "7.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
