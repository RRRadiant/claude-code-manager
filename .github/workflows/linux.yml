name: Linux (Kali / Debian)

on:
  push:
    branches: [main, master]
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'linux/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: linux

jobs:
  verify:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: linux/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  cli:
    name: Build CLI (ccm) x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: linux/cli/ccm-tui

      - name: Build TUI binary
        working-directory: linux/cli/ccm-tui
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload ccm
        uses: actions/upload-artifact@v4
        with:
          name: ccm-linux-x64
          path: linux/cli/ccm-tui/target/x86_64-unknown-linux-gnu/release/ccm
          if-no-files-found: error

  package-deb:
    name: Package .deb (x64, manual)
    # Packaging is deliberate: it downloads Electron and the fpm bundle, so it
    # runs on workflow_dispatch instead of on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: linux/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring libgtk-3-dev \
            libnotify-dev libnss3 libxss1 libasound2t64 libgbm-dev xdg-utils

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build .deb
        run: npm run package:deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-manager-deb
          path: linux/dist/*.deb
          if-no-files-found: error
