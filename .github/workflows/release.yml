name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  APP_NAME: 'ClaudeCodeManager'

jobs:
  build-x64:
    name: Build x64 (${{ matrix.bundle }})
    runs-on: windows-latest
    strategy:
      matrix:
        bundle: [portable, setup]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 Windows bundles are msi + nsis only; there is no native
      # "portable" bundle. The portable artifact is the raw release binary.
      - name: Build
        run: |
          if ("${{ matrix.bundle }}" -eq "portable") {
            npx tauri build --target x86_64-pc-windows-msvc --no-bundle
          } else {
            npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Portable: copy the raw release binary (target/release/*.exe) and
      # rename it to -portable.exe.
      - name: Rename portable
        if: matrix.bundle == 'portable'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No release binary found" }
          Copy-Item $exe.FullName "${{ env.APP_NAME }}-x64-portable.exe"

      # Setup: copy the NSIS installer as -setup.exe and the MSI as -setup.msi
      # (each keeps its own extension; the previous loop overwrote both into a
      # single -setup.exe).
      - name: Rename setup
        if: matrix.bundle == 'setup'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          Get-ChildItem "$bundle/nsis" -Filter '*.exe' | ForEach-Object {
            Copy-Item $_.FullName "${{ env.APP_NAME }}-x64-setup.exe"
          }
          Get-ChildItem "$bundle/msi" -Filter '*.msi' | ForEach-Object {
            Copy-Item $_.FullName "${{ env.APP_NAME }}-x64-setup.msi"
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          Get-ChildItem -Path '*.exe','*.msi' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append "${{ env.APP_NAME }}-x64-SHA256.txt"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-x64-${{ matrix.bundle }}
          path: |
            *.exe
            *.msi
            *.txt
          if-no-files-found: error

  build-arm64:
    name: Build ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install ARM64 build tools
        shell: pwsh
        run: |
          # Note: Requires Visual Studio with ARM64 build tools pre-installed on runner
          Write-Output "Building for ARM64..."

      # ARM64 delivers a true portable exe (MSI ARM64 support is limited).
      - name: Build
        run: npx tauri build --target aarch64-pc-windows-msvc --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No release binary found" }
          Copy-Item $exe.FullName "${{ env.APP_NAME }}-arm64-portable.exe"
          $hash = (Get-FileHash "${{ env.APP_NAME }}-arm64-portable.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ env.APP_NAME }}-arm64-portable.exe" | Out-File "${{ env.APP_NAME }}-arm64-SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-arm64
          path: |
            *.exe
            *.txt
          if-no-files-found: error

  generate-release:
    name: Generate Release
    needs: [build-x64, build-arm64]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets
          Get-ChildItem artifacts -Recurse -Include '*.exe','*.msi','*.txt' | ForEach-Object {
            Copy-Item $_.FullName "release-assets/"
          }

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $x64Setup = Get-ChildItem release-assets/*x64-setup* | Select-Object -First 1
          $x64Portable = Get-ChildItem release-assets/*x64-portable* | Select-Object -First 1
          $arm64Portable = Get-ChildItem release-assets/*arm64-portable* | Select-Object -First 1

          $manifest = @{
            version = $version
            notes = "请查看 Release Notes 获取详细变更。"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{}
          }

          if ($x64Setup) {
            $hash = (Get-FileHash "release-assets/$($x64Setup.Name)" -Algorithm SHA256).Hash.ToLower()
            $manifest.platforms['windows-x86_64'] = @{
              # TODO(signing): "<signature-from-build>" is a hardcoded placeholder.
              # A real Ed25519 signature (generated from the Tauri updater
              # signing key) is required before enabling auto-update. The updater
              # signing key lives in GitHub Secrets (TAURI_SIGNING_PRIVATE_KEY);
              # emit the signature here via `npx tauri signer sign` or by enabling
              # `createUpdaterArtifacts` in the build. Auto-update is currently
              # deferred (see docs/adr/0001-auto-update-deferred.md).
              signature = "<signature-from-build>"
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($x64Setup.Name)"
              sha256 = $hash
            }
          }

          if ($arm64Portable) {
            $hash = (Get-FileHash "release-assets/$($arm64Portable.Name)" -Algorithm SHA256).Hash.ToLower()
            $manifest.platforms['windows-aarch64'] = @{
              # TODO(signing): placeholder signature — see note above.
              signature = "<signature-from-build>"
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($arm64Portable.Name)"
              sha256 = $hash
            }
          }

          $manifest | ConvertTo-Json -Depth 10 | Out-File "release-assets/update-manifest.json" -Encoding UTF8

      - name: Generate SBOM
        shell: pwsh
        run: |
          # Generate a simple SBOM for the release
          $sbom = @{
            bomFormat = "CycloneDX"
            specVersion = "1.5"
            version = 1
            metadata = @{
              timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              component = @{
                name = "ClaudeCodeManager"
                version = "${{ github.ref_name }}"
                type = "application"
              }
            }
          }
          $sbom | ConvertTo-Json -Depth 10 | Out-File "release-assets/sbom.json" -Encoding UTF8

      # Draft, so the notes can be reviewed before publishing. The body is built
      # below from the CHANGELOG section that matches this tag — previously the
      # whole CHANGELOG was dumped in, which turned the release page into a wall
      # of text and overwrote any curated notes.
      - name: Extract release notes for this tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md

          # Prefer an explicit "## [<version>]" section; otherwise fall back to
          # "## [Unreleased]", which is where changes accumulate before a release.
          $startIdx = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $startIdx) {
            $startIdx = ($lines | Select-String -Pattern '^## \[Unreleased\]' | Select-Object -First 1).LineNumber
          }
          if (-not $startIdx) { throw "CHANGELOG.md has no section for $version and no [Unreleased] section" }

          # Stop at the next top-level version heading.
          $endIdx = $lines.Count
          for ($i = $startIdx; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { $endIdx = $i; break }
          }

          $notes = @(
            "# Claude Code Manager ${{ github.ref_name }}"
            ""
            "Windows 上管理 Claude Code 的图形工具：一键装好环境、配置 API 服务商、管理 MCP Server。"
            ""
            "下载、系统要求与安装说明见 [README](https://github.com/${{ github.repository }}#快速开始)。"
            ""
            "---"
            ""
            ($lines[$startIdx..($endIdx - 1)] -join "`n")
          ) -join "`n"

          $notes | Out-File "release-notes.md" -Encoding UTF8
          Write-Output "Release notes written ($($notes.Split("`n").Count) lines) for $version"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Code Manager ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
