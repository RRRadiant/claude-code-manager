[package]
name = "claude-code-manager"
version = "0.1.0"
description = "Claude Code Manager - Windows GUI for Claude Code"
authors = ["Claude Code Manager Contributors"]
license = "MIT"
repository = "https://github.com/claude-code-manager/claude-code-manager"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
regex = "1"

# Base64 for PowerShell `-EncodedCommand` (injection-safe script transport)
base64 = "0.22"

# In-process zip extraction. Replaces PowerShell's `Expand-Archive`, which is
# several times slower; this is also the fallback when `tar.exe` is unavailable.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID for task IDs
uuid = { version = "1", features = ["v4"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Environment"] }

# HTTP client (for API testing, model detection)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
# Async trait support
async-trait = "0.1"

# Streaming download
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# ===== Build profiles =====
#
# Without this, `target/` had grown to 14.3 GB locally — a single debug
# `app_lib.lib` was ~1 GB and each `.pdb` 100–150 MB, multiplied by every
# feature/hash variant produced while iterating.
#
# Debug info is what dominates that size, and it is not needed here:
#   * panic messages and `RUST_BACKTRACE=1` still give file/line and a symbolised
#     trace (they need symbol *names*, which are kept regardless);
#   * what `debug = false` gives up is stepping through frames in a native
#     debugger — a rare workflow for a Tauri app whose logic is testable in Rust.
# Add `debug = "line-tables-only"` instead if line-level debugger stepping is
# ever needed; it is a small fraction of full debug info.

# Local dev/test builds: keep them lean.
[profile.dev]
debug = false
incremental = true

# Third-party crates never need debug info in any profile.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = false

[profile.test.package."*"]
debug = false

# Release: strip symbols from the shipped binary too.
[profile.release]
debug = false
strip = true

